name: RapiDAST Scan

on:
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run RapiDAST
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/rapiddast:/rapiddast \
          quay.io/redhatproductsecurity/rapiddast:latest \
          rapiddast scan -c /rapiddast/config.yaml \
          --output /rapiddast/report

    - name: Upload Report
      uses: actions/upload-artifact@v3
      with:
        name: dast-report
        path: rapiddast/report/
